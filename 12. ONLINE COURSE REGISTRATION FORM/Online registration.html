<!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>
</head>
<body>

<h2>Online Course Registration Form</h2>


<form action="/submit" target="_blank">

    
    <input type="hidden" value="Online Course Registration" name="form_name">


    <label for="sname">Student Name:</label><br>
    <input type="text" id="sname" name="student_name" placeholder="Enter your full name" required>
    <br><br>

    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <br><br>

    <label for="mobile">Mobile Number:</label><br>
    <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required>
    <br><br>

    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age" placeholder="Enter your age">
    <br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" placeholder="Enter password" required>
    <br><br>

    
    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="Male" required>
    <label for="male">Male</label><br>
    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label><br>
    <input type="radio" id="other" name="gender" value="Other">
    <label for="other">Other</label>
    <br><br>

    
    <label>Skills:</label><br>
    <input type="checkbox" id="html" name="skills" value="HTML">
    <label for="html">HTML</label><br>
    <input type="checkbox" id="css" name="skills" value="CSS">
    <label for="css">CSS</label><br>
    <input type="checkbox" id="js" name="skills" value="JavaScript">
    <label for="js">JavaScript</label><br>
    <input type="checkbox" id="python" name="skills" value="Python">
    <label for="python">Python</label>
    <br><br>

    
    <label for="course">Select Course:</label><br>
    <select id="course" name="course" required>
        <option value="">-- Select a Course --</option>
        <option value="Web Development">Web Development</option>
        <option value="Python Programming">Python Programming</option>
        <option value="Data Analytics">Data Analytics</option>
        <option value="Digital Marketing">Digital Marketing</option>
    </select>
    <br><br>

    
    <label for="dob">Date of Birth:</label><br>
    <input type="date" id="dob" name="dob">
    <br><br>

    <label for="time">Preferred Class Time:</label><br>
    <input type="time" id="time" name="class_time">
    <br><br>

    
    <label for="address">Address / Additional Information:</label><br>
    <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea>
    <br><br>

    
    <label for="file">Upload Document / Photograph:</label><br>
    <input type="file" id="file" name="document">
    <br><br>

    
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
